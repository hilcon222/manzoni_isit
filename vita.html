    <h1>La vita di Alessandro Manzoni</h1>
    <p>
        Alessandro Manzoni nacque a Milano nel 1785, dal conte Pietro, un uomo di mediocre cultura, ricco possidente del contado di Lecco, e da Giulia Beccaria, figlia del giurista Cesare Beccaria, uno dei pi&ugrave; illustri rappresentanti dell'illuminismo lombardo.
